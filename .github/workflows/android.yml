name: Build downloadable Android APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build and verify
        run: |
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :mock-target:lintDebug :mock-target:assembleDebug --no-daemon --stacktrace

      - name: Stage release artifacts
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/aegis-controller.apk
          cp mock-target/build/outputs/apk/debug/mock-target-debug.apk release/aegis-mock-target.apk
          cd release
          sha256sum aegis-controller.apk aegis-mock-target.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-android-apks
          path: release/
          if-no-files-found: error

      - name: Publish stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="latest"
          RELEASE_TITLE="Latest Android APKs"
          RELEASE_NOTES=$(cat <<'EOF'
          ## Debug-signed test builds

          These APKs are **debug-signed test builds** produced automatically from the latest commit on `main`.

          - `aegis-controller.apk` — the floating controller application (debug build).
          - `aegis-mock-target.apk` — the mock target application used for safe local verification (debug build).
          - `SHA256SUMS.txt` — SHA-256 checksums for the two APKs above.

          ### Safety notice

          **REAL mode must NOT be used until live-target mapping and state transitions are inspected and verified.**

          - DEMO remains the default environment.
          - REAL mode requires exact risk acknowledgment, a valid preflight, and a deliberate START after every restart.
          - Do not treat balance changes as verified outcomes.
          - Do not assume the live target is verified until its Android accessibility hierarchy and state transitions are captured and tested.

          This release is continuously replaced on every successful push to `main`; the URL below stays stable:

          https://github.com/risktaker-tz/floating-controller-/releases/tag/latest
          EOF
          )

          # Delete an existing tag/release so the stable URL keeps pointing at the newest build.
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag || true

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target main \
            --latest \
            release/aegis-controller.apk release/aegis-mock-target.apk release/SHA256SUMS.txt
