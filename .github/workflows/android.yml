name: Build downloadable Android APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_PATH: /tmp/aegis.keystore
      BUILD_TOOLS_VERSION: '35.0.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Configure release signing from repository secrets. Skipped on PRs
      # (PRs do not have access to repository secrets). On push to main, this
      # step FAILS SAFELY when any secret is missing — there is NO debug
      # fallback. The keystore is decoded into the runner temp dir (outside
      # the workspace) and keystore.properties is written at the repo root
      # (gitignored). Both are deleted in the cleanup step.
      - name: Configure release signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.AEGIS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AEGIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AEGIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AEGIS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "$KEYSTORE_BASE64" ]  && missing+=("AEGIS_KEYSTORE_BASE64")
          [ -z "$KEYSTORE_PASSWORD" ] && missing+=("AEGIS_KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ]        && missing+=("AEGIS_KEY_ALIAS")
          [ -z "$KEY_PASSWORD" ]      && missing+=("AEGIS_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Release signing secrets missing: ${missing[*]}. Configure them in Settings → Secrets and variables → Actions. See scripts/setup-signing.sh. The workflow refuses to fall back to debug signing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE_PATH"
          cat > keystore.properties <<EOF
          storeFile=$RELEASE_KEYSTORE_PATH
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Keystore decoded to runner temp dir; keystore.properties written at repo root (gitignored)."

      # Always run tests + lint + assembleRelease + bundleRelease. On PRs the
      # release APK is unsigned (keystore.properties absent); the build still
      # succeeds and proves the code compiles. On push to main the APK is
      # signed because keystore.properties was created above.
      - name: Build and verify (tests, lint, assembleRelease, bundleRelease)
        run: |
          gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease :mock-target:lintRelease :mock-target:assembleRelease --no-daemon --stacktrace

      # Print the merged release manifest for review (per task: "merged manifest
      # is printed and reviewed during CI").
      - name: Print merged release manifests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          gradle :app:processReleaseManifest :mock-target:processReleaseManifest --no-daemon || true
          for module in app mock-target; do
            echo "=== Merged release manifest ($module) ==="
            f=$(find $module/build/intermediates -path '*release*' -name 'AndroidManifest.xml' -print -quit 2>/dev/null || true)
            if [ -n "$f" ] && [ -f "$f" ]; then
              echo "Path: $f"
              cat "$f"
            else
              echo "::warning::No merged release manifest found for $module; listing intermediates:"
              find $module/build/intermediates -name 'AndroidManifest.xml' -print 2>/dev/null || true
            fi
          done

      - name: Stage release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk        release/aegis-controller.apk
          cp mock-target/build/outputs/apk/release/mock-target-release.apk release/aegis-mock-target.apk
          cp app/build/outputs/bundle/release/app-release.aab     release/app-release.aab
          cd release
          sha256sum aegis-controller.apk aegis-mock-target.apk app-release.aab > SHA256SUMS.txt
          echo "=== Staged assets and SHA-256 ==="
          ls -l
          cat SHA256SUMS.txt

      # Verify ZIP alignment + signature (v1+v2+v3 where supported). Fail on:
      # misaligned, unsigned, Android Debug cert, missing v1, missing v2,
      # debuggable=true, or apksigner returning non-zero.
      - name: Verify ZIP alignment and signatures
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          BT="$SDK/build-tools/$BUILD_TOOLS_VERSION"
          ZIPALIGN="$BT/zipalign"
          APKSIGNER="$BT/apksigner"
          AAPT2="$BT/aapt2"
          chmod +x "$ZIPALIGN" "$APKSIGNER" "$AAPT2" || true
          for apk in release/aegis-controller.apk release/aegis-mock-target.apk; do
            echo "=========================================================="
            echo "Verifying $apk"
            echo "----------------------------------------------------------"
            echo "[1/4] zipalign -c -P 16 -v 4"
            "$ZIPALIGN" -c -P 16 -v 4 "$apk" || { echo "::error::$apk failed ZIP alignment (4-byte, 16 KiB page)"; exit 1; }
            echo "OK: zipalign passed"
            echo "----------------------------------------------------------"
            echo "[2/4] apksigner verify --verbose --print-certs"
            "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 26 "$apk" | tee /tmp/certs.txt
            if grep -qi "Android Debug" /tmp/certs.txt; then
              echo "::error::$apk is signed with the Android Debug certificate — refusing to publish."
              exit 1
            fi
            if ! grep -qi "Verified using v1 scheme" /tmp/certs.txt; then
              echo "::error::$apk is not v1-signed (JAR signing)."
              exit 1
            fi
            if ! grep -qi "Verified using v2 scheme" /tmp/certs.txt; then
              echo "::error::$apk is not v2-signed (APK Signature Scheme v2)."
              exit 1
            fi
            if grep -qi "Verified using v3 scheme" /tmp/certs.txt; then
              echo "OK: v3-signed (APK Signature Scheme v3)"
            else
              echo "::warning::$apk is not v3-signed (acceptable but not preferred)."
            fi
            echo "OK: signature schemes verified"
            echo "----------------------------------------------------------"
            echo "[3/4] debuggable check (binary manifest in APK)"
            "$AAPT2" dump xmltrees "$apk" --file AndroidManifest.xml > /tmp/xmltree.txt 2>&1 || true
            if grep -E "debuggable.*0xffffffff" /tmp/xmltree.txt >/dev/null 2>&1; then
              echo "::error::$apk has android:debuggable=true in its binary manifest."
              cat /tmp/xmltree.txt
              exit 1
            fi
            echo "OK: not debuggable"
            echo "----------------------------------------------------------"
            echo "[4/4] launcher activity + service export review"
            "$AAPT2" dump xmltrees "$apk" --file AndroidManifest.xml > /tmp/xmltree.txt 2>&1 || true
            grep -iE "exported|MainActivity|BubbleService|InspectService|BIND_ACCESSIBILITY_SERVICE|FOREGROUND_SERVICE" /tmp/xmltree.txt || true
          done
          echo "=========================================================="
          echo "All signature + alignment + debuggable checks passed."

      - name: Extract signing cert SHA-256
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: cert
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          APKSIGNER="$SDK/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          "$APKSIGNER" verify --print-certs --min-sdk-version 26 release/aegis-controller.apk > /tmp/certs_full.txt 2>&1 || true
          CERT_SHA256=$(grep -E 'SHA-256 digest:' /tmp/certs_full.txt | head -1 | sed -E 's/.*SHA-256 digest: //; s/[^0-9A-Fa-f:]//g')
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::Could not extract signing cert SHA-256."
            cat /tmp/certs_full.txt
            exit 1
          fi
          echo "Signing cert SHA-256: $CERT_SHA256"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "$CERT_SHA256" > /tmp/cert_sha256.txt
          # Save controller SHA-256 for release notes + asset re-verification
          sha256sum release/aegis-controller.apk | awk '{print $1}' > /tmp/controller_sha256.txt
          sha256sum release/aegis-mock-target.apk | awk '{print $1}' > /tmp/mock_sha256.txt
          sha256sum release/app-release.aab | awk '{print $1}' > /tmp/aab_sha256.txt

      # Boot Android emulator, install the local signed APK, verify Package
      # Manager accepts it, verify the launcher activity starts without
      # crashing, verify the installed cert matches the expected release cert.
      - name: Boot Android emulator and install/launch local APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # The reactivecircus/android-emulator-runner runs `script:` via /usr/bin/sh
          # (dash on Ubuntu), which does NOT support `set -o pipefail`. Use POSIX
          # `set -eu` instead. The action also disables Linux hardware acceleration
          # by default if /dev/kvm is not accessible; boot takes ~7 min without KVM.
          script: EXPECTED_CERT="${{ steps.cert.outputs.cert_sha256 }}" bash "$GITHUB_WORKSPACE/scripts/emulator_local_apk.sh"
      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: aegis-android-apks
          path: release/
          if-no-files-found: error

      # Publish or replace the stable 'latest' release. Replaces any prior tag
      # so the stable URL keeps pointing at the newest signed build.
      - name: Publish stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="latest"
          RELEASE_TITLE="Latest Android APKs"
          CONTROLLER_SHA=$(cat /tmp/controller_sha256.txt)
          MOCK_SHA=$(cat /tmp/mock_sha256.txt)
          AAB_SHA=$(cat /tmp/aab_sha256.txt)
          CERT_SHA=$(cat /tmp/cert_sha256.txt)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_SHA="${{ github.sha }}"
          VERSION_NAME="1.0.1"
          VERSION_CODE="2"
          MIN_SDK="26 (Android 8.0)"
          TARGET_SDK="35 (Android 15)"
          cat > /tmp/release-notes.md <<NOTES
          ## Latest Android APKs (release-signed)

          ### Provenance

          - **Version name:** ${VERSION_NAME}
          - **Version code:** ${VERSION_CODE}
          - **Commit SHA:** ${COMMIT_SHA}
          - **Build date (UTC):** ${BUILD_DATE}
          - **Minimum Android version:** ${MIN_SDK}
          - **Target Android version:** ${TARGET_SDK}

          ### Checksums (SHA-256)

          - \`aegis-controller.apk\`: \`${CONTROLLER_SHA}\`
          - \`aegis-mock-target.apk\`: \`${MOCK_SHA}\`
          - \`app-release.aab\`: \`${AAB_SHA}\`

          ### Signing certificate

          - **SHA-256 fingerprint:** \`${CERT_SHA}\`

          This is the stable release signing identity used for every build published at this URL.

          ### Verification gates passed before publishing

          - Unit tests pass
          - Lint passes for both modules
          - Release build succeeds
          - APK is non-debuggable
          - ZIP alignment (4-byte boundary, 16 KiB page) verified
          - apksigner verify passes with v1 + v2 (+ v3 where supported)
          - Not signed with the Android Debug certificate
          - Android emulator (API 34) installation + launcher activity start succeeded
          - Installed certificate matches the expected release certificate
          - Downloaded GitHub asset re-verified against locally-verified APK (below)

          ### Safety notice

          **REAL mode must NOT be used until live-target mapping and state transitions are inspected and verified.**

          - DEMO remains the default environment.
          - REAL mode requires exact risk acknowledgment, a valid preflight, and a deliberate START after every restart.
          - Do not treat balance changes as verified outcomes.
          - Do not assume the live target is verified until its Android accessibility hierarchy and state transitions are captured and tested.

          These APKs are release-signed (non-debuggable) and verified before publishing.

          Stable URL: https://github.com/risktaker-tz/floating-controller-/releases/tag/latest
          NOTES

          # Replace any prior latest release/tag so the stable URL keeps pointing at the newest build.
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag || true

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release-notes.md \
            --target main \
            --latest \
            release/aegis-controller.apk release/aegis-mock-target.apk release/app-release.aab release/SHA256SUMS.txt

          echo "Release published: https://github.com/$REPO/releases/tag/$TAG"

      # Re-download the published asset from the GitHub Release and verify it
      # matches the locally-verified APK (cryptographic exact-asset check).
      - name: Download and verify published assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="latest"
          mkdir -p /tmp/downloaded
          cd /tmp/downloaded
          # Retry up to 5 times to allow the CDN to make the asset available.
          for i in 1 2 3 4 5; do
            if gh release download "$TAG" --repo "$REPO" --pattern 'aegis-controller.apk' --pattern 'aegis-mock-target.apk' --pattern 'SHA256SUMS.txt' --clobber 2>/tmp/dl_err; then
              break
            fi
            echo "Download attempt $i failed; retrying in 10s..."
            cat /tmp/dl_err
            sleep 10
          done
          ls -la
          echo "=== SHA-256 comparison (local vs downloaded) ==="
          LOCAL_CONTROLLER_SHA=$(cat /tmp/controller_sha256.txt)
          DOWNLOADED_CONTROLLER_SHA=$(sha256sum aegis-controller.apk | awk '{print $1}')
          echo "Local release/aegis-controller.apk     : $LOCAL_CONTROLLER_SHA"
          echo "Downloaded aegis-controller.apk       : $DOWNLOADED_CONTROLLER_SHA"
          if [ "$LOCAL_CONTROLLER_SHA" != "$DOWNLOADED_CONTROLLER_SHA" ]; then
            echo "::error::Downloaded controller APK does not match locally-verified APK."
            exit 1
          fi
          echo "OK: downloaded controller APK matches locally-verified APK."
          echo "=== apksigner verify on downloaded APK ==="
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 26 aegis-controller.apk | tee /tmp/downloaded_certs.txt
          if grep -qi "Android Debug" /tmp/downloaded_certs.txt; then
            echo "::error::Downloaded APK is signed with the Android Debug certificate."
            exit 1
          fi
          echo "OK: downloaded APK signature verified."

      # Install the downloaded GitHub Release asset in a fresh emulator and
      # confirm it launches — proves the EXACT published asset works.
      - name: Boot Android emulator and install/launch downloaded asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: EXPECTED_CERT="${{ steps.cert.outputs.cert_sha256 }}" bash "$GITHUB_WORKSPACE/scripts/emulator_downloaded_apk.sh"
      # Always clean up signing material, even on failure.
      - name: Cleanup signing material
        if: always()
        run: |
          rm -f "$RELEASE_KEYSTORE_PATH" keystore.properties /tmp/certs.txt /tmp/certs_full.txt /tmp/cert_sha256.txt /tmp/xmltree.txt /tmp/controller_sha256.txt /tmp/mock_sha256.txt /tmp/aab_sha256.txt /tmp/downloaded_certs.txt 2>/dev/null || true
          rm -rf /tmp/downloaded 2>/dev/null || true
          echo "Signing material cleaned."
